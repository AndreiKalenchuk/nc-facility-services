<svg viewBox="0 0 600 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Janitorial cleaning cart with equipment in an office">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fe"/>
      <stop offset="1" stop-color="#e4eefb"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dCE9fb"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="600" height="460" rx="24" fill="url(#bg)"/>
  <!-- floor -->
  <path d="M0 366 H600 V436 a24 24 0 0 1 -24 24 H24 a24 24 0 0 1 -24 -24 Z" fill="#d6e5fa"/>
  <line x1="0" y1="366" x2="600" y2="366" stroke="#c3d8f4" stroke-width="3"/>

  <!-- office window -->
  <rect x="44" y="52" width="196" height="150" rx="10" fill="url(#win)" stroke="#bcd4f2" stroke-width="4"/>
  <line x1="142" y1="56" x2="142" y2="198" stroke="#cfe0f6" stroke-width="4"/>
  <line x1="48" y1="127" x2="236" y2="127" stroke="#cfe0f6" stroke-width="4"/>
  <path d="M60 70 L110 120 M90 66 L150 126" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- potted plant -->
  <rect x="70" y="300" width="46" height="60" rx="6" fill="#cddff7"/>
  <path d="M93 300 C70 260 78 232 93 214 C108 232 116 260 93 300 Z" fill="#b9d2f2"/>
  <path d="M93 300 C118 272 140 268 156 274 C138 296 116 306 93 300 Z" fill="#a9c7ee"/>
  <path d="M93 300 C68 272 46 268 30 274 C48 296 70 306 93 300 Z" fill="#c6dbf6"/>

  <!-- ===== Janitorial cart ===== -->
  <!-- back trash-bag hoop -->
  <rect x="470" y="150" width="60" height="150" rx="8" fill="#bcd4f2"/>
  <path d="M470 158 h60 v96 a30 30 0 0 1 -30 30 h0 a30 30 0 0 1 -30 -30 Z" fill="#3b83d6" opacity="0.85"/>
  <rect x="464" y="146" width="72" height="16" rx="8" fill="#2a6dc0"/>

  <!-- cart frame -->
  <rect x="300" y="176" width="196" height="150" rx="14" fill="#ffffff" stroke="#bcd4f2" stroke-width="6"/>
  <!-- shelves -->
  <rect x="300" y="250" width="196" height="10" fill="#dCE9fb"/>
  <rect x="308" y="176" width="180" height="20" rx="6" fill="#eaf1fb"/>

  <!-- push handle -->
  <path d="M300 196 H276 a10 10 0 0 0 -10 10 V320" stroke="#a9c7ee" stroke-width="10" stroke-linecap="round"/>

  <!-- top shelf items: folded towels + spray bottles -->
  <rect x="318" y="150" width="52" height="30" rx="5" fill="#cddff7"/>
  <rect x="318" y="158" width="52" height="6" fill="#a9c7ee"/>
  <!-- spray bottle 1 -->
  <rect x="392" y="132" width="26" height="46" rx="5" fill="#3b83d6"/>
  <rect x="398" y="120" width="14" height="16" rx="3" fill="#2a6dc0"/>
  <path d="M398 126 h-14 v8 h14" fill="#2a6dc0"/>
  <!-- spray bottle 2 -->
  <rect x="430" y="140" width="24" height="38" rx="5" fill="#a9c7ee"/>
  <rect x="435" y="130" width="13" height="14" rx="3" fill="#7fb0e6"/>

  <!-- middle shelf items: caddy + rolls -->
  <rect x="316" y="214" width="44" height="34" rx="5" fill="#7fb0e6"/>
  <rect x="324" y="204" width="28" height="12" rx="4" fill="#3b83d6"/>
  <circle cx="410" cy="230" r="17" fill="#eaf1fb" stroke="#bcd4f2" stroke-width="5"/>
  <circle cx="448" cy="230" r="17" fill="#eaf1fb" stroke="#bcd4f2" stroke-width="5"/>

  <!-- bottom shelf items -->
  <rect x="320" y="272" width="150" height="46" rx="6" fill="#dCE9fb"/>
  <rect x="320" y="272" width="70" height="46" rx="6" fill="#cddff7"/>

  <!-- cart wheels -->
  <circle cx="330" cy="336" r="16" fill="#2a6dc0"/>
  <circle cx="330" cy="336" r="6" fill="#eaf1fb"/>
  <circle cx="466" cy="336" r="16" fill="#2a6dc0"/>
  <circle cx="466" cy="336" r="6" fill="#eaf1fb"/>

  <!-- ===== Mop bucket + wringer (front left of cart) ===== -->
  <rect x="176" y="296" width="118" height="70" rx="12" fill="#3b83d6"/>
  <rect x="176" y="296" width="118" height="20" rx="10" fill="#2a6dc0"/>
  <!-- wringer -->
  <path d="M256 296 v-30 a14 14 0 0 1 14 -14 h20 v16 h-18 v28 Z" fill="#7fb0e6"/>
  <!-- water -->
  <rect x="188" y="312" width="94" height="12" rx="6" fill="#a9c7ee"/>
  <!-- wheels -->
  <circle cx="196" cy="368" r="12" fill="#2a6dc0"/>
  <circle cx="274" cy="368" r="12" fill="#2a6dc0"/>

  <!-- mop leaning -->
  <line x1="150" y1="130" x2="214" y2="316" stroke="#a9c7ee" stroke-width="9" stroke-linecap="round"/>
  <path d="M198 300 q16 -6 34 4 q-6 34 -18 46 q-20 -14 -16 -50 Z" fill="#cddff7"/>

  <!-- sparkles -->
  <path d="M540 70 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#a9c7ee"/>
  <path d="M258 210 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z" fill="#7fb0e6"/>
</svg>
